  <rect x="24" y="24" width="1152" height="312" rx="20" fill="#090F1E" stroke="#1E293B"/>
  <rect x="24" y="24" width="1152" height="312" rx="20" fill="none" stroke="url(#neon)" opacity="0.22"/>

  <!-- Grid -->
  <g opacity="0.16">
    <path d="M24 76H1176M24 128H1176M24 180H1176M24 232H1176M24 284H1176" stroke="#334155" stroke-width="1"/>
    <path d="M168 24V336M312 24V336M456 24V336M600 24V336M744 24V336M888 24V336M1032 24V336" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Pipeline -->
  <g font-family="Consolas, Monaco, monospace" font-size="16">
    <rect x="66" y="66" width="170" height="44" rx="10" fill="#0D162A" stroke="#22D3EE"/>
    <text x="88" y="94" fill="#7DD3FC">test: pipeline</text>

