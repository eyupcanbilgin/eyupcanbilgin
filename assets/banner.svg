    <rect x="774" y="168" width="64" height="110" rx="8" fill="#0D172A" stroke="#22D3EE"/>
    <circle cx="806" cy="289" r="6" fill="#22C55E"/>
    <path d="M785 186H827M785 202H827M785 218H815" stroke="#67E8F9" stroke-width="2"/>
