    <text x="892" y="216" fill="#93C5FD" font-size="24">QA Automation Engineer</text>
    <text x="892" y="248" fill="#A78BFA" font-size="15">UI Automation &#8226; API Automation</text>
    <text x="892" y="270" fill="#A78BFA" font-size="15">Mobile Testing &#8226; CI/CD</text>
