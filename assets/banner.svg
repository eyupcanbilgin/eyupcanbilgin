    <rect x="650" y="66" width="182" height="44" rx="10" fill="#101828" stroke="#06B6D4"/>
    <text x="672" y="94" fill="#67E8F9">flaky: monitored</text>
  </g>

  <g stroke="url(#neon)" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M236 88H260"/>
    <path d="M410 88H434"/>
    <path d="M624 88H650"/>
  </g>

  <!-- Terminal -->
  <g font-family="Consolas, Monaco, monospace">
    <rect x="70" y="140" width="520" height="164" rx="14" fill="#050914" stroke="#1F2937"/>
    <rect x="70" y="140" width="520" height="30" rx="14" fill="#0B1223"/>
    <circle cx="95" cy="155" r="5" fill="#22C55E"/>
    <circle cx="113" cy="155" r="5" fill="#22D3EE"/>
    <circle cx="131" cy="155" r="5" fill="#A855F7"/>
    <text x="156" y="160" fill="#93C5FD" font-size="13">qa-command-center</text>

    <text x="92" y="194" fill="#22D3EE" font-size="15">&gt; running UI scenarios...</text>
    <text x="92" y="220" fill="#22C55E" font-size="15">&gt; validating API contracts...</text>
    <text x="92" y="246" fill="#A78BFA" font-size="15">&gt; mobile banking flows: OK</text>
    <text x="92" y="272" fill="#86EFAC" font-size="15">&gt; release gate: PASS</text>
  </g>

  <!-- API indicator -->
